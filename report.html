<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 40px;
            color: #333;
        }

        .report-container {
            max-width: 600px;
            background: white;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        .report-section {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .report-section h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        .button-container button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button-container button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="report-container">
    <h1>Exercise Report</h1>

    <div class="report-section">
        <h2>Preferred Exercise Type</h2>
        <p id="exerciseType"></p>
    </div>

    <div class="report-section">
        <h2>Primary Fitness Goal</h2>
        <p id="fitnessGoal"></p>
    </div>

    <div class="button-container">
        <button onclick="goBack()">Back to Questionnaire</button>
    </div>
</div>

<script>
// Retrieve stored data and display it
window.onload = function () {
    const exerciseType = localStorage.getItem('exerciseType') || 'No preference selected';
    const fitnessGoal = localStorage.getItem('fitnessGoal') || 'No goal selected';

    document.getElementById('exerciseType').textContent = exerciseType;
    document.getElementById('fitnessGoal').textContent = fitnessGoal;
};

function goBack() {
    window.location.href = 'quest10.html';
}
</script>

</body>
</html>
